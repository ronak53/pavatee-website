<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your digital receipt — Pavatee</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://zsrkkgdoyodsmbqywoev.supabase.co; object-src 'self' blob: https://zsrkkgdoyodsmbqywoev.supabase.co; frame-src 'self' blob: https://zsrkkgdoyodsmbqywoev.supabase.co; base-uri 'none'; form-action 'none'">
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="stylesheet" href="../style.css">
<style>
  .claim-main {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 56px 20px;
  }
  /* the shared header is fixed on the home page; here it sits in the page flow */
  .site-header { position: static; }
  .claim-status { color: var(--ink-soft); margin-bottom: 4px; }
  .pdf-frame {
    width: 100%;
    max-width: 480px;
    height: 65vh;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin: 20px 0;
    background: #fff;
  }
  .error-box {
    background: #fdecea;
    color: #7a271a;
    padding: 16px 20px;
    border-radius: 8px;
    max-width: 420px;
  }
  .error-box p { color: inherit; margin: 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="https://pavatee.com">
      <img class="brand-mark" src="../assets/logo.svg" alt="" width="32" height="32">
      <span class="logo">Pavatee</span>
    </a>
  </div>
</header>

<main class="claim-main wrap">
  <div id="state-loading">
    <p class="claim-status" id="loading-text">Getting your receipt…</p>
  </div>

  <div id="state-error" style="display:none">
    <div class="error-box">
      <p id="error-message">This receipt link isn't valid or has expired.</p>
    </div>
  </div>

  <div id="state-ready" style="display:none">
    <h1>Your digital receipt</h1>
    <p class="claim-status">Nothing printed on paper — here's your copy.</p>
    <embed id="pdf-embed" class="pdf-frame" type="application/pdf">
    <a id="download-link" class="btn btn-primary" download="receipt.pdf">Download PDF</a>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span class="footer-brand">
      <img class="brand-mark" src="../assets/logo.svg" alt="" width="20" height="20">
      Pavatee
    </span>
    <span>&copy; 2026 Pavatee</span>
  </div>
</footer>

<script>
(function () {
  // The page holds no Supabase key and reads no table or file directly. It
  // asks the `receipt` function, which only answers for a ticket handed out
  // by a tap in the last 30 days, with a link to that one PDF valid a few
  // minutes.
  var RECEIPT_URL = "https://zsrkkgdoyodsmbqywoev.supabase.co/functions/v1/receipt";
  var TICKET_RE = /^[A-Za-z0-9_-]{43}$/;
  var PENDING_WAIT_MS = 45000;

  var ticket = new URLSearchParams(window.location.search).get("ticket");

  function el(id) { return document.getElementById(id); }
  function showState(name) {
    ["loading", "error", "ready"].forEach(function (s) {
      el("state-" + s).style.display = s === name ? "" : "none";
    });
  }
  function showError(message) {
    el("error-message").textContent = message;
    showState("error");
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  async function getLink() {
    // 202 = tapped while the till is still sending the receipt: wait and ask
    // again (up to PENDING_WAIT_MS). Network errors and "server busy" are
    // retried a few times; "not found" is final.
    var started = Date.now();
    var failures = 0;
    while (true) {
      try {
        var res = await fetch(RECEIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ticket: ticket }),
          cache: "no-store",
          referrerPolicy: "no-referrer",
        });
        if (res.status === 404) return null;
        if (res.status === 202) {
          if (Date.now() - started > PENDING_WAIT_MS) throw new Error("still pending");
          el("loading-text").textContent = "Getting your receipt… it's on its way from the till.";
          await wait(1000);
          continue;
        }
        if (res.ok) {
          var data = await res.json();
          if (data && data.url) return data.url;
        }
      } catch (e) {
        if (e && e.message === "still pending") throw e;
        // network hiccup - retry below
      }
      if (++failures >= 4) throw new Error("unavailable");
      await wait(1500);
    }
  }

  async function show() {
    if (!ticket || !TICKET_RE.test(ticket)) {
      showError("This receipt link isn't valid. Ask the cashier, then tap again.");
      return;
    }
    var url;
    try {
      url = await getLink();
    } catch (e) {
      showError("Your receipt couldn't be loaded right now. Please try again in a moment, or ask the cashier to print it.");
      return;
    }
    if (!url) {
      showError("This receipt link isn't valid or has expired. Receipts are kept for 30 days.");
      return;
    }
    try {
      var pdf = await fetch(url, { cache: "no-store", referrerPolicy: "no-referrer" });
      if (!pdf.ok) throw new Error("pdf");
      var blobUrl = URL.createObjectURL(await pdf.blob());
      el("pdf-embed").src = blobUrl;
      el("download-link").href = blobUrl;
    } catch (e) {
      // Fall back to the short-lived link itself.
      el("pdf-embed").src = url;
      el("download-link").href = url;
    }
    showState("ready");
  }

  show();
})();
</script>

</body>
</html>
